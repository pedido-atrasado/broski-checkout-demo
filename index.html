<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fazer uma doação — DEMO</title>
<style>
  :root { --azul:#0b5ed7; --linha:#dfe3e8; --cinza:#5a6b7b; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; margin:0; background:#f4f6f9; color:#1a2027; }
  .wrap { max-width:520px; margin:32px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--linha); border-radius:12px; padding:24px; }
  h1 { font-size:20px; margin:0 0 20px; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input, select { width:100%; padding:11px 12px; border:1px solid var(--linha); border-radius:8px; font-size:15px; font-family:inherit; }
  .metodos { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .metodo { border:2px solid var(--linha); border-radius:10px; padding:14px; text-align:center; cursor:pointer; background:#fff; display:flex; align-items:center; justify-content:center; min-height:64px; }
  .metodo.sel { border-color:var(--azul); background:#f0f6ff; }
  button.pagar { width:100%; margin-top:20px; padding:14px; border:0; border-radius:8px; background:var(--azul); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button.pagar:disabled { opacity:.5; cursor:not-allowed; }
  .erro { background:#fff4f4; border:1px solid #f3c2c2; color:#8a1f1f; padding:12px 14px; border-radius:8px; margin-top:16px; font-size:14px; line-height:1.5; }
  .aviso { background:#fff8e6; border:1px solid #f0d79a; color:#6b4e00; padding:12px 14px; border-radius:8px; margin-top:16px; font-size:14px; line-height:1.5; }
  .voucher { text-align:center; }
  .voucher .linha { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--linha); font-size:15px; }
  .voucher .linha b { font-size:19px; letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .espera { text-align:center; padding:18px 0; }
  .spin { width:38px; height:38px; margin:0 auto 16px; border:3px solid #e3e8ee; border-top-color:var(--azul); border-radius:50%; animation:g .9s linear infinite; }
  @keyframes g { to { transform:rotate(360deg); } }
  .ok { text-align:center; }
  .ok .tick { font-size:44px; color:#128a3d; }
  .sub { color:var(--cinza); font-size:14px; line-height:1.55; }
  #phone-wrap { display:none; }
  .valores { display:grid; gap:10px; margin-top:6px; }
  .valor { border:1px solid var(--linha); border-radius:10px; padding:16px; cursor:pointer; display:flex; gap:14px; align-items:flex-start; background:#fff; }
  .valor.sel { border-color:var(--azul); border-width:2px; padding:15px; background:#f7fbff; }
  .valor input[type=radio] { width:auto; margin:3px 0 0; accent-color:var(--azul); flex:none; }
  .valor .quantia { font-size:22px; font-weight:700; line-height:1.1; display:block; }
  .valor .oque { color:var(--cinza); font-size:14px; line-height:1.5; margin-top:5px; display:block; }
  .livre-input { display:none; margin-top:12px; align-items:center; gap:8px; }
  .valor.sel .livre-input { display:flex; }
  :focus-visible { outline:2px solid var(--azul); outline-offset:2px; }
  .faixa { position:fixed; top:0; left:0; right:0; z-index:99; background:#fff3cd; border-bottom:1px solid #e8c96a; color:#6b4e00; font-size:13px; line-height:1.45; padding:9px 14px; text-align:center; }
  body { padding-top:52px; }
</style>
</head>
<body>

<div class="faixa">
  ⚠️ <b>DEMO</b> — demonstração do frontend do checkout. Os pagamentos são <b>simulados</b>:
  nenhuma doação é cobrada, processada ou recebida.
</div>

<div class="wrap"><div class="card" id="app"></div></div>

<script>
/* ===========================================================================
   BACKEND SIMULADO — roda inteiramente no browser.
   Em produção isto é o server.js (Node + API Broski). Aqui as mesmas regras
   são replicadas em JS para a demo funcionar sem servidor:
     - o valor vem do "servidor" (CATALOG), nunca do corpo do pedido
     - telemóvel validado por ^9[1236]\d{7}$
     - limites MB WAY €0,50 a €5.000
     - MB WAY: pending -> paid (como se o webhook tivesse chegado)
     - Multibanco: awaiting_payment com entidade/referência, ecrã final
   =========================================================================== */
const SIM = (() => {
  const CATALOG = {
    'doacao-30':   { amount: 3000,   description: 'Doação — 12 dias de medicação para dor' },
    'doacao-50':   { amount: 5000,   description: 'Doação — 19 dias de medicação para dor' },
    'doacao-100':  { amount: 10000,  description: 'Doação — 20 dias de pensos especiais' },
    'doacao-250':  { amount: 25000,  description: 'Doação — 30 dias de medicação, pensos especiais e refeições' },
    'doacao-500':  { amount: 50000,  description: 'Doação — 60 dias de medicação, pensos especiais e refeições' },
    'doacao-1000': { amount: 100000, description: 'Doação — 120 dias de medicação, pensos especiais e refeições' },
  };
  const LIVRE = { min: 100, max: 500000 };
  const MBWAY_MIN = 50, MBWAY_MAX = 500000;

  const orders = new Map();
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function normalizePhone(raw) {
    const d = String(raw || '').replace(/[\s\-().]/g, '');
    const nat = d.startsWith('+351') ? d.slice(4) : (d.startsWith('351') && d.length === 12 ? d.slice(3) : d);
    return /^9[1236]\d{7}$/.test(nat) ? '+351' + nat : null;
  }

  const ok  = (data, status = 201) => ({ ok: true,  status, data });
  const bad = (error, message, status = 400) => ({ ok: false, status, data: { error, message } });

  const newRef = () => 'demo-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  function mbReference() {
    let s = '';
    for (let i = 0; i < 9; i++) s += Math.floor(Math.random() * 10);
    return s.slice(0, 3) + ' ' + s.slice(3, 6) + ' ' + s.slice(6, 9);
  }

  async function checkout(body) {
    await sleep(450);                                  // latência simulada
    const { sku, amount: rawAmount, method, phone, email } = body || {};

    // O valor vem SEMPRE daqui, ignorando o que veio no corpo — menos doacao-livre.
    let item = CATALOG[sku];
    if (sku === 'doacao-livre') {
      const n = Number(rawAmount);
      if (!Number.isInteger(n)) return bad('valor_invalido', 'Indique um valor válido.');
      if (n < LIVRE.min || n > LIVRE.max) {
        return bad('valor_invalido', 'Indique um valor entre ' + (LIVRE.min / 100).toFixed(2).replace('.', ',') +
                   ' € e ' + (LIVRE.max / 100).toFixed(2).replace('.', ',') + ' €.');
      }
      item = { amount: n, description: 'Doação — valor personalizado' };
    }
    if (!item)                  return bad('sku_invalido', 'Valor desconhecido.');
    if (!email)                 return bad('email_obrigatorio', 'Indique o seu e-mail.');
    if (method !== 'mbway' && method !== 'multibanco') return bad('metodo_invalido', 'Método inválido.');

    let phoneNorm = null;
    if (method === 'mbway') {
      phoneNorm = normalizePhone(phone);
      if (!phoneNorm) return bad('telemovel_invalido', 'Introduza um telemóvel português válido (9 dígitos).');
      if (item.amount < MBWAY_MIN || item.amount > MBWAY_MAX) return bad('valor_invalido', 'MB WAY aceita €0,50 a €5.000.');
      for (const o of orders.values()) {
        if (o.method === 'mbway' && o.phone === phoneNorm && o.status === 'pending') {
          // 409 NAO e falha de pagamento — a UI mostra a message tal e qual.
          return { ok: false, status: 409, data: {
            error: 'mbway_pending_for_phone',
            message: 'Já existe um pedido MB WAY pendente para este número. Confirme na app MB WAY ou aguarde alguns minutos.',
          } };
        }
      }
    }

    const now = Date.now();
    const rec = {
      ref: newRef(),
      status: method === 'mbway' ? 'pending' : 'awaiting_payment',
      method, amount: item.amount, description: item.description,
      phone: phoneNorm,
      multibanco: method === 'multibanco' ? {
        entity: '11249',
        reference: mbReference(),
        amount: item.amount,
        expires_at: new Date(now + 2 * 24 * 3600 * 1000).toISOString(),
      } : null,
      fulfilled: false, amount_refunded: 0,
      _confirmaEm: now + (method === 'mbway' ? 6000 : 12000),   // como o mock do projeto
    };
    orders.set(rec.ref, rec);

    return ok({
      ref: rec.ref, status: rec.status, method: rec.method,
      amount: rec.amount, multibanco: rec.multibanco, description: rec.description,
    });
  }

  async function status(ref) {
    const o = orders.get(ref);
    if (!o) return bad('nao_encontrado', 'Pedido não encontrado.', 404);
    if (o.status !== 'paid' && Date.now() >= o._confirmaEm) {
      o.status = 'paid'; o.fulfilled = true;            // equivale ao webhook order.paid
    }
    return ok({
      ref: o.ref, status: o.status, fulfilled: o.fulfilled,
      amount: o.amount, amount_refunded: o.amount_refunded, multibanco: o.multibanco,
    }, 200);
  }

  return { checkout, status, normalizePhone };
})();

/* ============================ UI (igual ao original) ======================= */
const app = document.getElementById('app');
let poll = null, prazo = null;

const eur = c => '€' + (c/100).toFixed(2).replace('.', ',');

// Espelha o CATALOG do servidor — isto e so o texto que o doador ve.
const DEGRAUS = [
  { sku:'doacao-30',   amount:3000,   oque:'12 dias de medicação para dor' },
  { sku:'doacao-50',   amount:5000,   oque:'19 dias de medicação para dor' },
  { sku:'doacao-100',  amount:10000,  oque:'20 dias de pensos especiais' },
  { sku:'doacao-250',  amount:25000,  oque:'30 dias de medicação, pensos especiais e refeições' },
  { sku:'doacao-500',  amount:50000,  oque:'60 dias de medicação, pensos especiais e refeições' },
  { sku:'doacao-1000', amount:100000, oque:'120 dias de medicação, pensos especiais e refeições' },
];
const LIVRE_MIN = 100, LIVRE_MAX = 500000;   // tem de bater com o server.js

function formulario(erroHtml = '') {
  clearInterval(poll); clearInterval(prazo);
  app.innerHTML = `
    <h1>Fazer uma doação</h1>
    <label>Valor da doação</label>
    <div class="valores">
      ${DEGRAUS.map(d => `
      <label class="valor" data-sku="${d.sku}">
        <input type="radio" name="valor" value="${d.sku}">
        <span><span class="quantia">${eur(d.amount)}</span><span class="oque">${d.oque}</span></span>
      </label>`).join('')}
      <label class="valor" data-sku="doacao-livre">
        <input type="radio" name="valor" value="doacao-livre">
        <span style="flex:1">
          <span class="quantia">Outro valor</span>
          <span class="oque">Escolha quanto quer doar</span>
          <span class="livre-input">
            <span style="font-size:18px;color:var(--cinza)">€</span>
            <input id="livre" inputmode="decimal" placeholder="0,00" aria-label="Valor da doação em euros">
          </span>
        </span>
      </label>
    </div>
    <label for="name">Nome</label>
    <input id="name" autocomplete="name">
    <label for="email">E-mail *</label>
    <input id="email" type="email" required autocomplete="email">
    <label>Método de pagamento</label>
    <div class="metodos">
      <div class="metodo sel" data-m="mbway">
        <img src="assets/mbway.svg" alt="MB WAY" height="28">
      </div>
      <div class="metodo" data-m="multibanco">
        <img src="assets/multibanco.svg" alt="Multibanco" height="40">
      </div>
    </div>
    <div id="phone-wrap" style="display:block">
      <label for="phone">Telemóvel MB WAY *</label>
      <input id="phone" inputmode="numeric" placeholder="9XX XXX XXX" autocomplete="tel">
    </div>
    ${erroHtml}
    <button class="pagar" id="btn">Doar</button>`;

  const cartoes = [...document.querySelectorAll('.valor')];
  const marcar = el => {
    cartoes.forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    el.querySelector('input[type=radio]').checked = true;
  };
  cartoes.forEach(el => el.addEventListener('click', () => marcar(el)));
  marcar(cartoes[1]);   // €50 pre-selecionado

  let metodo = 'mbway';
  document.querySelectorAll('.metodo').forEach(el => el.onclick = () => {
    document.querySelectorAll('.metodo').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    metodo = el.dataset.m;
    document.getElementById('phone-wrap').style.display = metodo === 'mbway' ? 'block' : 'none';
  });

  document.getElementById('btn').onclick = async () => {
    const escolhido = document.querySelector('.valor.sel');
    if (!escolhido) return formulario(`<div class="erro">Escolha um valor para doar.</div>`);
    const sku = escolhido.dataset.sku;
    let amount;
    if (sku === 'doacao-livre') {
      const bruto = document.getElementById('livre').value.trim().replace(',', '.');
      amount = Math.round(Number(bruto) * 100);
      if (!bruto || !Number.isFinite(amount) || amount < LIVRE_MIN || amount > LIVRE_MAX) {
        return formulario(`<div class="erro">Indique um valor entre ${eur(LIVRE_MIN)} e ${eur(LIVRE_MAX)}.</div>`);
      }
    }

    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'A processar…';
    const body = {
      sku, amount,
      method: metodo,
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
    };
    try {
      const r = await SIM.checkout(body);
      const d = r.data;
      if (!r.ok) {
        // 409 mbway_pending_for_phone: mostrar a message tal e qual, NAO e falha de pagamento.
        const cls = d.error === 'mbway_pending_for_phone' ? 'aviso' : 'erro';
        return formulario(`<div class="${cls}">${d.message || d.error}</div>`);
      }
      d.method === 'mbway' ? esperaMbway(d) : voucher(d);
    } catch (e) {
      formulario(`<div class="erro">Erro de rede. Tente novamente.</div>`);
    }
  };
}

// MB WAY: ecra de espera + polling do NOSSO servidor (2-3s), timeout de UX ~5 min.
function esperaMbway(d) {
  const inicio = Date.now();
  app.innerHTML = `
    <div class="espera">
      <div class="spin"></div>
      <h1 style="margin-bottom:8px">Confirme o pagamento na app MB WAY</h1>
      <p class="sub">Enviámos um pedido de ${eur(d.amount)} para o seu telemóvel.<br>Abra a app MB WAY e confirme.</p>
      <p class="sub" style="margin-top:16px" id="tempo"></p>
      <p class="sub" style="margin-top:18px;font-size:12px;opacity:.75">Demo: o pagamento confirma sozinho em ~6 s.</p>
    </div>`;

  poll = setInterval(async () => {
    const dec = Math.max(0, 300 - Math.floor((Date.now()-inicio)/1000));
    document.getElementById('tempo').textContent =
      `Tempo restante: ${String(Math.floor(dec/60)).padStart(2,'0')}:${String(dec%60).padStart(2,'0')}`;

    if (dec === 0) { clearInterval(poll); return naoConfirmado('O tempo para confirmar esgotou.'); }

    const r = await SIM.status(d.ref);
    const s = r.data;
    if (s.status === 'paid') { clearInterval(poll); return pago(s); }
    if (s.status === 'failed' || s.status === 'expired') {
      clearInterval(poll);
      return naoConfirmado('O pagamento não foi confirmado.');
    }
  }, 2500);
}

// Multibanco: ecra FINAL, sem spinner e sem polling.
function voucher(d) {
  const mb = d.multibanco || {};
  const exp = mb.expires_at ? new Date(mb.expires_at).toLocaleString('pt-PT') : '—';
  app.innerHTML = `
    <div class="voucher">
      <img src="assets/multibanco.svg" alt="Multibanco" height="48">
      <h1 style="margin:16px 0 6px">Guarde estes dados</h1>
      <p class="sub">Pague num Multibanco, no homebanking ou na app do seu banco.</p>
      <div style="margin-top:18px;text-align:left">
        <div class="linha"><span>Entidade</span><b>${mb.entity || '—'}</b></div>
        <div class="linha"><span>Referência</span><b>${mb.reference || '—'}</b></div>
        <div class="linha"><span>Valor</span><b>${eur(mb.amount ?? d.amount)}</b></div>
        <div class="linha" style="border:0"><span>Válido até</span><b style="font-size:15px">${exp}</b></div>
      </div>
      <p class="sub" style="margin-top:18px"><b>Referência de demonstração</b> — não é pagável em nenhum Multibanco.</p>
      <button class="pagar" onclick="location.reload()">Concluir</button>
    </div>`;
}

function pago(s) {
  app.innerHTML = `
    <div class="ok">
      <div class="tick">✓</div>
      <h1>Doação confirmada</h1>
      <p class="sub">Recebemos ${eur(s.amount)}. Obrigado.</p>
      <p class="sub">Referência: <code>${s.ref}</code></p>
      <p class="sub" style="margin-top:14px;font-size:12px;opacity:.75">Simulação — nenhum valor foi cobrado.</p>
      <button class="pagar" onclick="location.reload()">Voltar</button>
    </div>`;
}

function naoConfirmado(msg) {
  formulario(`<div class="erro">${msg} Pode tentar novamente.</div>`);
}

formulario();
</script>
</body>
</html>
